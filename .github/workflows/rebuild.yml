# Check Specs — automatic site rebuild
# INSTALL LOCATION (later, not done by this prep): .github/workflows/rebuild.yml
#
# What it does: jab bhi admin panel (ya koi bhi) verified/expand-*.json ya
# img/** mein change GitHub par push karta hai, ye workflow:
#   1) python3 build.py chala kar site dobara banata hai (bilkul waisa hi
#      jaisa Muse apne computer se chalata hai — build.py sirf Python
#      standard library use karta hai, koi install nahi chahiye)
#   2) bani hui site files ko wapas main branch par commit kar deta hai
# GitHub Pages main branch ke /docs folder se site serve karta hai (2026-11-04
# restructure: source files root par rehte hain, serve nahi hote),
# is liye commit hote hi nayi site live ho jati hai.
#
# Equivalence note: abhi Muse deploy_contents.py se har file Contents API
# se bhejta hai. Ye workflow usi natije ka git wala rasta hai — bani hui
# files main branch par pohonchti hain aur Pages wahi serve karta hai.
# Fark sirf itna hai: deploy_contents.py har dafa Pages ko dobara enable
# bhi karta hai (POST /pages); workflow ye nahi karta kyunke Pages pehle
# se enabled hai. Agar Pages kabhi band ho jaye to ek dafa Muse ko
# deploy chalana hoga — README mein likha hai.

name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - "verified/expand-*.json"
      - "docs/img/**"
  workflow_dispatch: {}

permissions:
  contents: write

# Ek waqt mein ek hi rebuild — do saves takrayen to line mein lag jayen
concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (image sizes in generated pages)
        run: pip install Pillow

      - name: Install Pillow (image sizes in generated pages)
        run: pip install Pillow

      - name: Build the site
        run: python3 build.py

      - name: Commit the built site back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sirf build ki bani hui output files stage karo (scratch/cache nahi)
          stage() {
            git add docs 2>/dev/null || true
          }
          stage
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "site: auto rebuild after model change [skip ci]"
          # Push takra jaye (dusra deploy beech mein aa gaya) to latest main
          # par dobara build karke phir koshish karo — generated files hain,
          # dobara banana hi sabse saaf hal hai
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected - syncing to latest main and rebuilding (attempt $i)"
            git fetch origin main
            git reset --hard origin/main
            python3 build.py
            stage
            if git diff --cached --quiet; then
              echo "Already up to date on latest main."
              exit 0
            fi
            git commit -m "site: auto rebuild after model change [skip ci]"
          done
          echo "Push failed after all retries."
          exit 1
